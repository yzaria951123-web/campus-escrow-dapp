<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Campus Escrow DApp</title>
  <script src="https://cdn.jsdelivr.net/npm/ethers@6.13.4/dist/ethers.umd.min.js"></script>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 720px; margin: 40px auto; padding: 0 16px; color: #222; }
    h1 { margin-bottom: 4px; }
    .sub { color: #666; margin-top: 0; }
    .card { border: 1px solid #ddd; border-radius: 8px; padding: 12px; margin: 10px 0; }
    button { padding: 6px 12px; margin: 6px 6px 0 0; cursor: pointer; }
    input { padding: 6px; margin-right: 6px; }
    .tag { display: inline-block; padding: 2px 8px; border-radius: 10px; background: #e8eefc; font-size: 12px; }
    #status { color: #444; margin: 12px 0; word-break: break-all; }
  </style>
</head>
<body>
  <h1>Campus Escrow DApp</h1>
  <p class="sub">Second-hand trades where payment is locked in a smart contract until the buyer confirms receipt.</p>

  <button id="connectBtn">Connect Wallet</button>
  <p>Wallet: <span id="account">Not connected</span></p>
  <p>Network: <span id="network">-</span></p>

  <h3>List an Item (Seller)</h3>
  <input id="nameInput" placeholder="Item name" />
  <input id="priceInput" placeholder="Price (ETH)" style="width:120px" />
  <button id="listBtn">List Item</button>

  <h3>Items</h3>
  <div id="list">Connect your wallet to see items.</div>
  <p id="status"></p>

<script>
// TODO: replace with your deployed contract address on Sepolia
const CONTRACT_ADDRESS = "0x8aB8aff56f55263F10c5d9e7c198B9712cC8a26A";
const SEPOLIA_CHAIN_ID = "0xaa36a7";
const STATUS = ["Listed", "Paid (funds locked)", "Completed", "Cancelled", "Refunded"];
const ABI = [
  "function listItem(string name, uint256 price)",
  "function buyItem(uint256 id) payable",
  "function confirmReceipt(uint256 id)",
  "function cancelItem(uint256 id)",
  "function refund(uint256 id)",
  "function getItemCount() view returns (uint256)",
  "function getItem(uint256 id) view returns (address seller, address buyer, string name, uint256 price, uint256 paidAt, uint8 status)"
];

let provider, signer, contract, me;
const $ = (id) => document.getElementById(id);
const setStatus = (t) => ($("status").textContent = t);
const short = (a) => a.slice(0, 6) + "..." + a.slice(-4);
const esc = (s) => s.replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

async function connectWallet() {
  if (!window.ethereum) return alert("Please install MetaMask first.");
  try {
    await window.ethereum.request({ method: "eth_requestAccounts" });
    const chainId = await window.ethereum.request({ method: "eth_chainId" });
    if (chainId !== SEPOLIA_CHAIN_ID) {
      await window.ethereum.request({
        method: "wallet_switchEthereumChain",
        params: [{ chainId: SEPOLIA_CHAIN_ID }],
      });
    }
    provider = new ethers.BrowserProvider(window.ethereum);
    signer = await provider.getSigner();
    me = await signer.getAddress();
    contract = new ethers.Contract(CONTRACT_ADDRESS, ABI, signer);
    $("account").textContent = me;
    $("network").textContent = "Sepolia";
    await loadItems();
  } catch (e) {
    setStatus("Connect failed: " + (e.shortMessage || e.message));
  }
}

// Generic transaction sender: MetaMask popup -> wait for confirmation -> refresh
async function sendTx(label, fn) {
  try {
    setStatus(`${label}: confirm in MetaMask...`);
    const tx = await fn();
    setStatus(`${label}: sent, waiting for confirmation... ${tx.hash}`);
    await tx.wait();
    setStatus(`${label} succeeded! https://sepolia.etherscan.io/tx/${tx.hash}`);
    await loadItems();
  } catch (e) {
    setStatus(`${label} failed: ` + (e.reason || e.shortMessage || e.message));
  }
}

async function listItem() {
  const name = $("nameInput").value.trim();
  const price = $("priceInput").value.trim();
  if (!name || !price) return setStatus("Please enter an item name and price.");
  let wei;
  try { wei = ethers.parseEther(price); } catch { return setStatus("Invalid price."); }
  await sendTx("List item", () => contract.listItem(name, wei));
  $("nameInput").value = "";
  $("priceInput").value = "";
}

async function loadItems() {
  const count = Number(await contract.getItemCount());
  $("list").innerHTML = count === 0 ? "No items yet." : "";
  for (let i = 0; i < count; i++) {
    const [seller, buyer, name, price, , status] = await contract.getItem(i);
    const s = Number(status);
    const isSeller = seller.toLowerCase() === me.toLowerCase();
    const isBuyer = buyer.toLowerCase() === me.toLowerCase();

    const div = document.createElement("div");
    div.className = "card";
    div.innerHTML = `<b>#${i} ${esc(name)}</b> <span class="tag">${STATUS[s]}</span><br>
      Price: ${ethers.formatEther(price)} ETH<br>
      <small>Seller: ${short(seller)}${isSeller ? " (you)" : ""}${
        s >= 1 ? " | Buyer: " + short(buyer) + (isBuyer ? " (you)" : "") : ""}</small><br>`;

    const btn = (text, fn) => {
      const b = document.createElement("button");
      b.textContent = text;
      b.onclick = fn;
      div.appendChild(b);
    };
    if (s === 0 && !isSeller) btn("Buy", () => sendTx("Payment", () => contract.buyItem(i, { value: price })));
    if (s === 0 && isSeller) btn("Cancel listing", () => sendTx("Cancel", () => contract.cancelItem(i)));
    if (s === 1 && isBuyer) {
      btn("Confirm receipt", () => sendTx("Confirm receipt", () => contract.confirmReceipt(i)));
      btn("Refund (after timeout)", () => sendTx("Refund", () => contract.refund(i)));
    }
    $("list").appendChild(div);
  }
}

$("connectBtn").onclick = connectWallet;
$("listBtn").onclick = listItem;
if (window.ethereum) {
  window.ethereum.on("accountsChanged", () => location.reload());
  window.ethereum.on("chainChanged", () => location.reload());
}
</script>
</body>
</html>
